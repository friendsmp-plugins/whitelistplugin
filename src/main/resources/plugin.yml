name: whitelistplugin
version: '${version}'
main: com.centers25.whitelistplugin.WhitelistPlugin
api-version: '26.2'
author: centers25
depend: [plugincore]
commands:
  migrate:
    permission: whitelistplugin.migrate
    usage: /migrate
  whitelistpluginreload:
    permission: whitelistplugin.reload
permissions:
  whitelistplugin.migrate:
    default: op
  whitelistplugin.reload:
    default: op
